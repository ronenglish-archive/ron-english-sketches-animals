      text-align: center;
      text-decoration: none;
    }

    .index-card:hover {

      box-shadow: 0 5px 16px #00000014;
    }

    .index-image {
      display: flex;
      flex: 0 0 158px;
      width: 100%;
      height: 158px;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 8px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }

    .index-image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .index-title {
      margin: 0;
      padding: 10px 8px 12px;
      font: 500 14px/1.35 Georgia, "Times New Roman", serif;
      overflow-wrap: anywhere;
      text-align: center;

      color: #666;
      font-size: 13px;
      text-align: center;
