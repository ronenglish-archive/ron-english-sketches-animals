function init(shell){
  var g=shell.querySelector('.group-grid');
  var p=shell.querySelector('.carousel-arrow.prev');
  var n=shell.querySelector('.carousel-arrow.next');
  if(!g||!p||!n)return;
  var epsilon=3;
  function update(){
    var remaining=Math.max(0,g.scrollWidth-g.clientWidth);
    var over=remaining>epsilon;
    var left=over&&g.scrollLeft>epsilon;
    var right=over&&g.scrollLeft<remaining-epsilon;
    p.hidden=!left;p.disabled=!left;
    n.hidden=!right;n.disabled=!right;
    g.style.justifyContent=over?'flex-start':'center';
  }
  function advance(dir){
    var c=g.querySelector('.index-card');
    if(!c)return;
    var gap=parseFloat(getComputedStyle(g).gap)||9;
    var step=c.getBoundingClientRect().width+gap;
    var max=Math.max(0,g.scrollWidth-g.clientWidth);
    var target=Math.max(0,Math.min(max,g.scrollLeft+dir*step));
    g.scrollTo({left:target,behavior:'smooth'});
  }
  p.addEventListener('click',function(){advance(-1)});
  n.addEventListener('click',function(){advance(1)});
  g.addEventListener('scroll',update,{passive:true});
  window.addEventListener('resize',update);
  if('ResizeObserver' in window)new ResizeObserver(update).observe(g);
  window.addEventListener('load',update);
  requestAnimationFrame(update);
  update();
}
document.querySelectorAll('.carousel-shell').forEach(init);
})();</script></main></body></html>
