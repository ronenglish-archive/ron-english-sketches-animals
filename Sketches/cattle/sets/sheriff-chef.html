<header class="page-header"><h1 class="page-title">Sheriff Chef</h1></header><section class="section-card" data-role="set-index"><div class="carousel-shell"><button aria-label="Previous members" class="carousel-arrow prev" type="button" hidden disabled>&#8249;</button><section class="index-grid group-grid"><a class="index-card" href="../entries/re-012725.html"><img src="https://ronenglish-archive.github.io/ron-english-sketches-animals/images/Sketches/Ungulates/cattle/Sherrif%20Chef%20COLOR.jpg" alt="Sheriff Chef" loading="lazy"><div class="card-title">Sheriff Chef</div></a><a class="index-card" href="../entries/re-014699.html"><img src="https://raw.githubusercontent.com/ronenglish-archive/ron-english-sketches-and-drawings-2/main/Images/Scan_20260617%20%28138%29f.jpg?v=20260617r" alt="Sheriff Chef Standing Tall" loading="lazy"><div class="card-title">Sheriff Chef Standing Tall</div></a><a class="index-card" href="../entries/re-013573.html"><img src="https://ronenglish-archive.github.io/ron-english-sketches-animals/images/Sketches/Ungulates/cattle/Sheriff%20Chef%202%20COLOR.jpg" alt="Sheriff Chef on All Fours" loading="lazy"><div class="card-title">Sheriff Chef on All Fours</div></a></section><button aria-label="Next members" class="carousel-arrow next" type="button" hidden disabled>&#8250;</button></div></section><nav class="sequence-nav ron-bottom-prev-next-center" aria-label="Catalogue sequence"><a class="nav-pill" href="raquel-cowgirl.html">&larr; Previous: Raquel Cowgirl</a><a class="nav-pill" href="../entries/re-017275.html">Next: Steer Crazy &rarr;</a></nav><footer>Published via GitHub Pages<br>for long-term public access.</footer><script data-ron-set-carousel="alien-cherub-canonical-v7">(function(){
function init(shell){
  var g=shell.querySelector('.group-grid');
  var p=shell.querySelector('.carousel-arrow.prev');
  var n=shell.querySelector('.carousel-arrow.next');
  if(!g||!p||!n)return;
  var epsilon=3;
  function update(){
    var remaining=Math.max(0,g.scrollWidth-g.clientWidth);
    var over=remaining>epsilon;
    var left=over&&g.scrollLeft>epsilon;
    var right=over&&g.scrollLeft<remaining-epsilon;
    p.hidden=!left;p.disabled=!left;
    n.hidden=!right;n.disabled=!right;
    g.style.justifyContent=over?'flex-start':'center';
  }
  function advance(dir){
    var c=g.querySelector('.index-card');
    if(!c)return;
    var gap=parseFloat(getComputedStyle(g).gap)||9;
    var step=c.getBoundingClientRect().width+gap;
    var max=Math.max(0,g.scrollWidth-g.clientWidth);
    var target=Math.max(0,Math.min(max,g.scrollLeft+dir*step));
    g.scrollTo({left:target,behavior:'smooth'});
  }
  p.addEventListener('click',function(){advance(-1)});
  n.addEventListener('click',function(){advance(1)});
  g.addEventListener('scroll',update,{passive:true});
  window.addEventListener('resize',update);
  if('ResizeObserver' in window)new ResizeObserver(update).observe(g);
  window.addEventListener('load',update);
  requestAnimationFrame(update);
  update();
}
document.querySelectorAll('.carousel-shell').forEach(init);
})();</script></main></body></html>
